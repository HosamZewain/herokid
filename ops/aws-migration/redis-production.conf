# Reviewed settings to merge after backing up redis.conf. Do not FLUSH any Redis DB.
bind 127.0.0.1 ::1
protected-mode yes
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
# Leave enough memory for PHP, MySQL and the OS; monitor Redis used_memory and OOM.
# Enable AOF at runtime first, wait for aof_rewrite_in_progress=0 and aof_last_bgrewrite_status=ok,
# then persist configuration and verify a controlled restart before production workers start.
