; INACTIVE TEMPLATE: install only after GO-LIVE, import, media verification and role switch.
; All autostart flags are false: start each worker deliberately after final checks.
[program:herokid-default]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/herokid/artisan queue:work redis --queue=default --sleep=2 --tries=3 --backoff=30 --timeout=840 --max-time=3600
numprocs=2
user=www-data
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/var/log/supervisor/herokid-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:herokid-conversations]
command=/usr/bin/php /var/www/herokid/artisan queue:work database --queue=robodesk-conversations --sleep=2 --tries=1 --timeout=25 --max-time=3600
user=www-data
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/var/log/supervisor/herokid-conversations.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:herokid-legacy-database]
; Drain imported default DB jobs; stop after empty. Do not abandon them when switching to Redis.
command=/usr/bin/php /var/www/herokid/artisan queue:work database --queue=default --stop-when-empty --tries=3 --backoff=30 --timeout=840
user=www-data
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/var/log/supervisor/herokid-legacy-database.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:herokid-order-automation]
; Enable only if the final production feature/config review requires this queue.
command=/usr/bin/php /var/www/herokid/artisan queue:work order-automation --queue=order-automation --sleep=2 --tries=1 --timeout=240 --max-time=3600
user=www-data
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=600
redirect_stderr=true
stdout_logfile=/var/log/supervisor/herokid-order-automation.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
