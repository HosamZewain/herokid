# Prepared production configuration. Install ONLY after GO-LIVE approval.
server {
    listen 80;
    listen [::]:80;
    server_name hero-kid.com www.hero-kid.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://hero-kid.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hero-kid.com;
    ssl_certificate /etc/letsencrypt/live/hero-kid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hero-kid.com/privkey.pem;
    return 301 https://hero-kid.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hero-kid.com;
    root /var/www/herokid/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/hero-kid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hero-kid.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php(/|$) {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 900;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    access_log /var/log/nginx/herokid-production-access.log;
    error_log /var/log/nginx/herokid-production-error.log;
}
