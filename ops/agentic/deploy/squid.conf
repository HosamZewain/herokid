# No TLS interception, request body logging, cache, general HTTP or open proxy.
http_port 3128
visible_hostname herokid-autopilot-egress
acl subscription_domains dstdomain -n chatgpt.com auth.openai.com
acl tls_port port 443
acl tunnel method CONNECT
acl private_destinations dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
http_access deny !tunnel
http_access deny !tls_port
http_access deny !subscription_domains
http_access deny private_destinations
http_access allow subscription_domains
http_access deny all
cache deny all
cache_mem 0 MB
access_log none
cache_store_log none
cache_log stdio:/dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
netdb_filename none
forwarded_for delete
pinger_enable off
connect_timeout 10 seconds
request_timeout 15 seconds
read_timeout 90 seconds
client_lifetime 2 minutes
shutdown_lifetime 1 seconds
